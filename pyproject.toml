[project]
name = "bitexact-verifier"
version = "1.0.0"
description = "Standalone verifier for BitExact evidence bundles (bitexact-bundle/1)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "BitExact" }]
keywords = ["verification", "evidence", "audit", "ed25519", "rfc8785",
            "in-toto", "dsse", "ai-agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Quality Assurance",
    "Operating System :: OS Independent",
]
dependencies = ["cryptography>=43"]

[project.urls]
Homepage = "https://bitexact.dev"
Repository = "https://github.com/bitexact/bitexact-verifier"

[project.scripts]
bitexact-verifier = "bitexact_verifier:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["bitexact_verifier.py"]

[tool.hatch.build.targets.sdist]
include = ["bitexact_verifier.py", "README.md", "LICENSE",
           "bundle-spec.md", "test_vectors.py", "testdata"]
