[project]
name = "bitexact-verifier"
version = "1.0.0"
description = "Standalone verifier for BitExact evidence bundles (bitexact-bundle/1)"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["cryptography>=43"]

[project.scripts]
bitexact-verifier = "bitexact_verifier:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["bitexact_verifier.py"]
