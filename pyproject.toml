[project]
name = "bitexact-verifier"
version = "0.0.1a0"
description = "Standalone verifier for BitExact evidence bundles (aer-bundle)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "BitExact" }]
keywords = ["verification", "evidence", "audit", "ed25519", "rfc8785",
            "in-toto", "dsse", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Quality Assurance",
    "Operating System :: OS Independent",
]
dependencies = ["cryptography>=50.0.2", "asn1crypto>=1.5.1"]

[project.urls]
Homepage = "https://bitexact.dev"
Repository = "https://github.com/bitexact/bitexact-verifier"

[project.scripts]
bitexact-verifier = "bitexact_verifier:main"

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["bitexact_verifier.py"]

[tool.hatch.build.targets.sdist]
include = ["bitexact_verifier.py", "README.md", "LICENSE", "CHECKSUMS.txt",
           "bundle-spec.md", "test_vectors.py", "testdata"]
# The fixture generator drives the licensed product; the fixtures it wrote
# ship, the generator does not.
exclude = ["testdata/make_fixtures.py"]
